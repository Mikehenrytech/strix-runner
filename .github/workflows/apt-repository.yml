name: Update APT Repository

on:
  release:
    types: [published]
  workflow_run:
    workflows: ["Release"]
    types:
      - completed
  repository_dispatch:
    types: [dashboard-release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-apt:
    name: Update APT repository on GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install apt-utils
        run: sudo apt-get update && sudo apt-get install -y apt-utils

      - name: Determine release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event.action }}" = "dashboard-release" ]; then
            TAG="v${{ github.event.client_payload.dashboard_version }}"
            REPO="Mikehenrytech/strix-runner-dashboard"
            PKG_DIR="pool/main/s/strix-runner-dashboard"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
            REPO="${{ github.repository }}"
            PKG_DIR="pool/main/s/strix-runner"
          else
            TAG=$(gh release view --repo "${{ github.repository }}" --json tagName -q '.tagName')
            REPO="${{ github.repository }}"
            PKG_DIR="pool/main/s/strix-runner"
          fi
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"
          echo "REPO=${REPO}" >> "$GITHUB_OUTPUT"
          echo "PKG_DIR=${PKG_DIR}" >> "$GITHUB_OUTPUT"
          echo "Using release tag: ${TAG} from ${REPO}"

      - name: Check if package is already published
        id: check
        run: |
          set -e
          pkg_dir="${{ steps.release.outputs.PKG_DIR }}"
          tag="${{ steps.release.outputs.TAG }}"
          version="${tag#v}"
          pkg_name="$(basename "${pkg_dir}")"
          packages_file="dists/stable/main/binary-amd64/Packages"
          if [ -f "${packages_file}" ] && \
             grep -A1 "^Package: ${pkg_name}$" "${packages_file}" | grep -q "^Version: ${version}$" && \
             [ -n "$(find "${pkg_dir}" -maxdepth 1 -name '*.deb' -print -quit 2>/dev/null)" ]; then
            echo "Package ${pkg_name} ${version} is already published. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download .deb from release
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p "${{ steps.release.outputs.PKG_DIR }}"
          rm -f "${{ steps.release.outputs.PKG_DIR }}"/*.deb
          gh release download "${{ steps.release.outputs.TAG }}" \
            --repo "${{ steps.release.outputs.REPO }}" \
            --pattern "*.deb" \
            --clobber \
            --dir "${{ steps.release.outputs.PKG_DIR }}/"

      - name: Generate APT metadata
        if: steps.check.outputs.skip != 'true'
        run: |
          set -e
          mkdir -p dists/stable/main/binary-amd64
          apt-ftparchive packages pool/main > dists/stable/main/binary-amd64/Packages
          gzip -k -f dists/stable/main/binary-amd64/Packages
          apt-ftparchive release dists/stable > dists/stable/Release
          {
            echo "Origin: Strix Runner"
            echo "Label: Strix Runner"
            echo "Suite: stable"
            echo "Codename: stable"
            cat dists/stable/Release
          } > dists/stable/Release.tmp
          mv dists/stable/Release.tmp dists/stable/Release

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          exclude_assets: '.github,README.md,CHANGELOG.md,LICENSE,LICENSE-ADDENDUM.md,strix_runner.py,test_strix_runner.py,strix-config.example.json,additional-instruction.example.md,packaging'
