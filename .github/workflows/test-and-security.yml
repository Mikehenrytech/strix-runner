name: Test and Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile source and tests
        run: python3 -m py_compile strix_runner.py test_strix_runner.py

      - name: Validate example configuration
        run: python3 -m json.tool strix-config.example.json

      - name: Run unit tests
        run: python3 -m unittest -v

  security:
    name: Static security analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit
        run: bandit -r strix_runner.py
