name: Build Binary

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_call:

jobs:
  build:
    name: Build standalone binary with PyInstaller
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build binary
        run: pyinstaller --onefile --name strix-runner strix_runner.py

      - name: Generate checksum
        run: |
          cd dist
          sha256sum strix-runner > strix-runner.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: strix-runner-binary
          path: |
            dist/strix-runner
            dist/strix-runner.sha256
